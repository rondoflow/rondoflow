rules:
  - id: no-hardcoded-secrets
    languages: [typescript, javascript, python]
    patterns:
      - pattern-regex: "(?i)(api[_-]?key|secret|token|password|credential).*=.*['\"][^'\"]+['\"]"
      - pattern-regex: "(?i)(base64|hex).*(=|:)\\s*[A-Za-z0-9+/=]{20,}"
    message: "Detected potential hardcoded secret. Use environment variables instead."
    severity: ERROR

  - id: no-console-debug
    languages: [typescript]
    patterns:
      - pattern-regex: "console\\.(log|error|warn)\\s*\\("
    message: "Console debug statements should not be in production code."
    severity: WARNING

  - id: no-eval
    languages: [typescript, javascript]
    patterns:
      - pattern: eval($X)
    message: "eval() is a security risk and should be avoided."
    severity: ERROR
